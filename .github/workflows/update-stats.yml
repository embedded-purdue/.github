name: Update organization stats

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/update-stats.yml
      - profile/README.md

permissions:
  contents: write

concurrency:
  group: organization-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch organization stats
        run: python scripts/update_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit refreshed profile
        run: |
          if git diff --quiet -- profile/README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md
          git commit -m 'Update organization GitHub stats'
          git push
